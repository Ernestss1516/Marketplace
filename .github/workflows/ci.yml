name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Job 1: Static checks — no service containers needed
  # ──────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @marketplace/api prisma:generate

      - name: Typecheck API
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Lint web
        run: pnpm --filter @marketplace/web lint

      - name: Typecheck web
        run: pnpm --filter @marketplace/web type-check

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 2: E2E tests — backend Jest suites, then Playwright critical path.
  # Both share marketplace_test so they run sequentially as steps.
  #
  # MinIO is NOT a service container: minio/minio requires `server /data` as the
  # Docker CMD, which service containers cannot specify. It is started as a step
  # with `docker run -d` instead (see "Start MinIO" below).
  # bitnami/minio was the previous workaround but its Docker Hub repo now has
  # zero tags (confirmed 2025-06-23).
  # ──────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    # No async handle leak was found in apps/api/test/jest-e2e.json (forceExit
    # removed after confirming with --detectOpenHandles that Jest already exits
    # on its own). This bound replaces that safety net: fail loudly instead of
    # hanging for GitHub's 360-minute default if a genuine hang is introduced.
    #
    # 30 → 60. La premisa de los 30 ("la batería de backend + Playwright tardan
    # bastante menos de 15 minutos") era FALSA y por eso el job se cancelaba sin
    # dar veredicto. Medido de verdad, en local y en modo CI:
    #   · batería backend (Jest, --runInBand) ....... ~4,5 min
    #   · next build (producción, para next start) .. ~1 min
    #   · Playwright: 271 tests, 1 worker ........... ~45 min (~10 s/test)
    # Los 30 minutos no daban ni para Playwright solo, y encima Playwright era el
    # ÚLTIMO paso: se comía lo que sobraba de los otros.
    #
    # Se sube DESPUÉS de atacar la lentitud, no en su lugar: el backend ya no
    # arranca con `--watch` y las esperas tienen plazo finito (ver
    # playwright.config.ts). Subir el límite sin eso solo habría retrasado el corte.
    #
    # Sigue siendo un límite FINITO y holgado, no un cheque en blanco. Si se quiere
    # bajar el reloj de verdad, la vía es repartir Playwright en varios shards
    # (`--shard=i/N`) como jobs de matriz: cada job trae sus propios contenedores de
    # servicio, así que cada shard tendría SU base/Redis/Meili y el estado
    # compartido que hoy obliga a `workers: 1` dejaría de ser un problema. Es una
    # reestructuración del workflow, no un ajuste — queda propuesta, no hecha.
    timeout-minutes: 60

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace_dev
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      meilisearch:
        image: getmeili/meilisearch:v1.10
        env:
          MEILI_MASTER_KEY: masterKey_ci
          MEILI_ENV: development
        ports:
          - 7700:7700
        # No health-cmd: the container binds port 7700 after a short init window that
        # exhausted the retry budget in CI. A polling step below waits instead.

    env:
      # ── PostgreSQL ─────────────────────────────────────────────────────────────
      DATABASE_URL: postgresql://marketplace:marketplace_dev@localhost:5432/marketplace_test

      # ── Redis (DB 1 for test isolation; dev uses DB 0) ─────────────────────────
      REDIS_URL: redis://localhost:6379/1

      # ── Meilisearch ────────────────────────────────────────────────────────────
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: masterKey_ci
      MEILI_INDEX_NAME: listings_test

      # ── NestJS auth ────────────────────────────────────────────────────────────
      JWT_SECRET: ci_jwt_secret

      # ── Email — Resend not called in tests; value satisfies Joi validation ─────
      RESEND_API_KEY: ci_dummy_resend
      RESEND_FROM: noreply@example.com
      # Frontend URL — BlogService.callRevalidateEndpoint() lo usa para llamar a
      # POST /api/revalidate (Next.js Route Handler, puerto 3000), NUNCA el del
      # propio backend (3001). El valor equivocado (3001) hacía que la petición
      # se golpeara a sí misma (Nest 404, "Cannot POST /api/revalidate") y el
      # fetch().catch(() => {}) fire-and-forget lo tragaba en silencio —
      # revalidateTag('footer-pages') nunca se ejecutaba en CI. Confirmado con
      # curl (404 en :3001 vs 200 en :3000) y repro end-to-end aislando esta
      # única variable. Ver docs/estado-tecnico.md.
      APP_URL: http://localhost:3000

      # ── S3 / MinIO — must match the credentials used in the "Start MinIO" step ─
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: marketplace-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PUBLIC_URL: http://localhost:9000/marketplace-test

      # ── Next.js / next-auth v5 (AUTH_* not NEXTAUTH_*) ────────────────────────
      # next.config.ts already allows { hostname: 'localhost' } for Next Image,
      # so MinIO URLs (http://localhost:9000/...) render without domain errors.
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_WS_URL: http://localhost:3001
      AUTH_SECRET: ci_auth_secret
      AUTH_URL: http://localhost:3000

      # ── ISR revalidación on-demand (blog, páginas, footer) ─────────────────────
      # Debe coincidir en el backend (firma la petición a /api/revalidate) y en
      # next start (la verifica) — un único env: de job ya garantiza esto. Valor
      # de test (no un secreto real), igual que JWT_SECRET arriba: directo aquí,
      # sin necesidad de GitHub Secrets. Sin esta variable, BlogService nunca
      # llega a llamar a /api/revalidate (corta antes por "if (!secret) return"),
      # así que el footer/blog/páginas solo se actualizan al expirar el TTL de
      # cada caché (hasta 1h), no al instante — rompía footer-paginas.spec.ts
      # de forma consistente en CI.
      REVALIDATE_SECRET: change_me_same_as_web

      # ── Process ────────────────────────────────────────────────────────────────
      NODE_ENV: test
      PORT: "3001"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @marketplace/api prisma:generate

      # Lógica pura (period del cron de facturación, NIF/DNI/NIE/CIF, el parser de
      # la query de búsqueda, el resolver de atributos filtrables…): 17 *.spec.ts,
      # 164 tests. NO necesitan Postgres/Redis/Meili/MinIO, así que van ANTES del
      # montaje de infraestructura: si se rompe lógica pura, el job cae en ~20 s en
      # vez de gastar los ~5 min de MinIO + navegadores de Playwright para nada.
      #
      # `test` (jest a secas, rootDir=src, testRegex .*\.spec\.ts$) NO se solapa con
      # `test:e2e` (--config test/jest-e2e.json, rootDir=.., testRegex
      # test/.*\.e2e-spec\.ts$): los dos conjuntos son disjuntos por regex y por
      # rootDir, así que este paso no re-ejecuta ningún e2e ni se deja ningún unit.
      #
      # Hasta ahora estos 17 solo corrían si alguien los lanzaba a mano — verdes que
      # nadie miraba. Verificados en local antes de añadir el paso: 17/17, 164/164.
      - name: Backend unit — Jest
        run: pnpm --filter @marketplace/api test

      # Poll /keys (requires auth) instead of /health: /health returns 200 as soon
      # as the HTTP server binds port 7700, but the key-management subsystem may
      # finish initialization a moment later. A 200 from /keys confirms both that
      # the server is up AND that the master key is accepted — eliminating the
      # timing window that caused "The provided API key is invalid" in the backend
      # started by Playwright's webServer.
      - name: Wait for Meilisearch
        run: >-
          timeout 30 bash -c
          'until curl -sf -H "Authorization: Bearer masterKey_ci"
          http://localhost:7700/keys; do sleep 1; done'

      # Tag pinned to a confirmed-live release (verified on Docker Hub 2025-06-23).
      # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD must match S3_ACCESS_KEY_ID /
      # S3_SECRET_ACCESS_KEY in the job env and the AWS CLI call below.
      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-06-13T11-33-47Z \
            server /data

          # Poll /minio/health/live — proceed only when MinIO is ready.
          # timeout 30 exits with code 1 if the loop never succeeds.
          timeout 30 bash -c \
            'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'

          # Create the test bucket. AWS CLI is pre-installed on ubuntu-latest.
          # Credentials must match MINIO_ROOT_USER / MINIO_ROOT_PASSWORD above.
          AWS_ACCESS_KEY_ID=minioadmin \
          AWS_SECRET_ACCESS_KEY=minioadmin \
          aws s3 mb s3://marketplace-test \
            --endpoint-url http://localhost:9000 \
            --region us-east-1

          # Allow anonymous GET on all objects so Next/Image can fetch uploaded
          # images from http://localhost:9000/marketplace-test/<key> without auth.
          AWS_ACCESS_KEY_ID=minioadmin \
          AWS_SECRET_ACCESS_KEY=minioadmin \
          aws s3api put-bucket-policy \
            --bucket marketplace-test \
            --endpoint-url http://localhost:9000 \
            --region us-east-1 \
            --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::marketplace-test/*"]}]}'

      - name: Install Playwright browsers
        run: pnpm --filter @marketplace/web exec playwright install --with-deps chromium

      # globalSetup (setup-e2e.js) runs prisma migrate deploy + seed-test.ts.
      # dotenv.config() inside globalSetup is a no-op in CI (vars already in env).
      - name: Backend e2e — Jest
        run: pnpm --filter @marketplace/api test:e2e

      # Pure component tests (jsdom, no services required) — separate from the
      # Playwright e2e suite below, which needs the full stack running.
      - name: Frontend unit — Jest
        run: pnpm --filter @marketplace/web test:unit

      # Playwright's webServer runs `next start` (production) in CI instead of `next
      # dev`, which requires an existing build — `next dev`'s built-in dev-only memory
      # watchdog was self-restarting the process mid-suite on this memory-constrained
      # runner (~9min/111 tests), killing whatever test was mid-navigation at the time.
      # See playwright.config.ts for the full explanation. NEXT_PUBLIC_* vars are baked
      # in at build time, so this step must run with the same job-level env as below.
      - name: Build frontend for e2e (production build — see playwright.config.ts)
        run: pnpm --filter @marketplace/web build


      # Playwright spawns the backend (port 3001) and frontend (port 3000) via
      # webServer because reuseExistingServer = !process.env.CI = false.
      # global-setup.ts migrates (idempotent after Jest), seeds Playwright users,
      # and saves storageState. The backend webServer receives { ...process.env,
      # ...testEnv, PORT: '3001' } — the fix in playwright.config.ts ensures all
      # job env vars reach the NestJS process when .env.test is absent in CI.
      # ── LA SEÑAL ────────────────────────────────────────────────────────────
      # Todo MENOS los @2b. Si esto falla, el fallo es REAL y el pipeline cae.
      # 248 de los 271 tests. `--grep-invert @2b` es el complemento exacto del
      # paso de abajo: verificado con `playwright test --list` (248 + 23 = 271).
      # (Decía "265 + 6" — cifras del primer etiquetado POR INCIDENCIA, anterior
      # al retag POR PATRÓN. El árbitro es `--list`, no este comentario.)
      #
      # CADA PASO ESCRIBE SU PROPIO INFORME. Los dos usaban el
      # `playwright-report/` por defecto, y como el upload va DESPUÉS de ambos, el
      # informe de la señal —el que decide el pipeline— quedaba pisado por el del
      # @2b en cada corrida: el artefacto solo enseñaba 23 tests. Se diagnosticaba
      # el pipeline a ciegas justo por el lado que importa.
      # `PLAYWRIGHT_HTML_OUTPUT_DIR` se resuelve con `path.resolve()` sobre el cwd,
      # y `pnpm --filter` ejecuta con cwd = apps/web (verificado), así que estos
      # valores relativos caen en `apps/web/`.
      #
      # ── SE INVOCA CON `exec`, NUNCA CON `run <script> -- <args>` ────────────
      # Esto era `pnpm ... test:e2e -- --grep-invert "@2b"`, y el filtro NUNCA
      # aplicó en CI: el step señal corría los 271 (medido con `gh`), los @2b
      # fallaban por el router wedge, el step salía 1 y el job iba a Failure —
      # arrastrando además al step @2b, que quedaba `skipped`.
      #
      # La causa es la frontera `--`, y DIVERGE ENTRE SHELLS:
      #   PowerShell → playwright test "--list" "--grep-invert" "@2b"   → 248 ✔
      #   bash/CI    → playwright test "--" "--list" "--grep-invert" "@2b" → 271 ✘
      # PowerShell se COME el token `--`; bash lo pasa literal, y Playwright lo
      # trata como fin-de-opciones: todo lo que sigue queda INERTE (ni siquiera
      # `--list` funciona). Por eso local medía 248 y el runner corría 271: se
      # estuvo verificando el filtro en el shell que ya había alterado el comando.
      #
      # `pnpm exec <bin> <args>` NO tiene esa frontera: los argumentos van al
      # binario sin pasar por el reenvío de argumentos de `run`. Elimina la CLASE
      # de bug, no solo el caso de bash. Es equivalente directo porque el script
      # `test:e2e` es exactamente `playwright test`, sin pre/post hooks.
      - name: Frontend e2e — Playwright (señal, sin @2b)
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-senal
        run: pnpm --filter @marketplace/web exec playwright test --grep-invert "@2b"

      # ── EL RUIDO CONOCIDO ───────────────────────────────────────────────────
      # Solo los @2b: la carrera de navegación del App Router bajo `next start`
      # (bug de Next 15, firma de vercel/next.js#57565, sin fix upstream). Está
      # caracterizada en 5 rondas y mitigada hasta donde se puede
      # (`prefetch={false}` en las tarjetas + reintento del clic en
      # `e2e/helpers/nav.ts`), pero NO se puede garantizar verde: el router queda
      # wedged y ni esperar más ni reintentar lo recupera siempre.
      #
      # `continue-on-error: true` → informa pero no bloquea. NO es esconderlo: el
      # paso aparece en la UI de Actions con su resultado, y el informe HTML se
      # sube igual en el paso siguiente. Lo que se evita es que un bug de Next
      # tumbe un pipeline cuyo producto funciona.
      #
      # CUIDADO al añadir tests aquí: la etiqueta @2b solo se pone sobre una firma
      # `waitForURL … until "commit"` CONFIRMADA. Etiquetar un rojo de otra causa
      # sería un `test.fixme` disfrazado — escondería un bug real, que es
      # exactamente lo que esta separación existe para impedir.
      #
      # `if: always()` ADEMÁS del `continue-on-error`. Son cosas distintas y hacían
      # falta las dos: `continue-on-error` impide que su fallo tumbe el job, pero
      # NO hace que el step corra. Sin `if:`, un step solo se ejecuta si todos los
      # anteriores fueron bien — así que cuando el señal fallaba, este quedaba
      # `skipped` y el conjunto tolerado no informaba de nada (confirmado con `gh`:
      # nunca ha llegado a correr en CI). Con `always()` informa su tasa pase lo que
      # pase, incluso si el señal cae por un no-@2b real.
      - name: Frontend e2e — Playwright (@2b, known-issue de Next — informa, no bloquea)
        if: always()
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-2b
        run: pnpm --filter @marketplace/web exec playwright test --grep "@2b"

      # DOS artefactos con nombre distinto: el de la SEÑAL es el que hay que mirar
      # para decidir si el producto está bien; el de @2b informa del ruido tolerado.
      # `if: always()` en los dos para que el informe exista también cuando la señal
      # cae — que es justo cuando hace falta leerlo.
      - name: Upload Playwright report (señal)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-senal
          path: apps/web/playwright-report-senal/
          retention-days: 7

      - name: Upload Playwright report (@2b, tolerado)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-2b
          path: apps/web/playwright-report-2b/
          retention-days: 7

name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Job 1: Static checks — no service containers needed
  # ──────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @marketplace/api prisma:generate

      - name: Typecheck API
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Lint web
        run: pnpm --filter @marketplace/web lint

      - name: Typecheck web
        run: pnpm --filter @marketplace/web type-check

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 2: E2E tests — backend Jest suites, then Playwright critical path.
  # Both share marketplace_test so they run sequentially as steps.
  #
  # MinIO is NOT a service container: minio/minio requires `server /data` as the
  # Docker CMD, which service containers cannot specify. It is started as a step
  # with `docker run -d` instead (see "Start MinIO" below).
  # bitnami/minio was the previous workaround but its Docker Hub repo now has
  # zero tags (confirmed 2025-06-23).
  # ──────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace_dev
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      meilisearch:
        image: getmeili/meilisearch:v1.10
        env:
          MEILI_MASTER_KEY: masterKey_ci
          MEILI_ENV: development
        ports:
          - 7700:7700
        # No health-cmd: the container binds port 7700 after a short init window that
        # exhausted the retry budget in CI. A polling step below waits instead.

    env:
      # ── PostgreSQL ─────────────────────────────────────────────────────────────
      DATABASE_URL: postgresql://marketplace:marketplace_dev@localhost:5432/marketplace_test

      # ── Redis (DB 1 for test isolation; dev uses DB 0) ─────────────────────────
      REDIS_URL: redis://localhost:6379/1

      # ── Meilisearch ────────────────────────────────────────────────────────────
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: masterKey_ci
      MEILI_INDEX_NAME: listings_test

      # ── NestJS auth ────────────────────────────────────────────────────────────
      JWT_SECRET: ci_jwt_secret

      # ── Email — Resend not called in tests; value satisfies Joi validation ─────
      RESEND_API_KEY: ci_dummy_resend
      RESEND_FROM: noreply@test.local
      APP_URL: http://localhost:3001

      # ── S3 / MinIO — must match the credentials used in the "Start MinIO" step ─
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: marketplace-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PUBLIC_URL: http://localhost:9000/marketplace-test

      # ── Next.js / next-auth v5 (AUTH_* not NEXTAUTH_*) ────────────────────────
      # next.config.ts already allows { hostname: 'localhost' } for Next Image,
      # so MinIO URLs (http://localhost:9000/...) render without domain errors.
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_WS_URL: http://localhost:3001
      AUTH_SECRET: ci_auth_secret
      AUTH_URL: http://localhost:3000

      # ── Process ────────────────────────────────────────────────────────────────
      NODE_ENV: test
      PORT: "3001"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @marketplace/api prisma:generate

      # /health is public even with MEILI_MASTER_KEY set (confirmed). Polling from
      # the host via the mapped port; no auth header needed.
      - name: Wait for Meilisearch
        run: timeout 30 bash -c 'until curl -sf http://localhost:7700/health; do sleep 1; done'

      # Tag pinned to a confirmed-live release (verified on Docker Hub 2025-06-23).
      # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD must match S3_ACCESS_KEY_ID /
      # S3_SECRET_ACCESS_KEY in the job env and the AWS CLI call below.
      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-06-13T11-33-47Z \
            server /data

          # Poll /minio/health/live — proceed only when MinIO is ready.
          # timeout 30 exits with code 1 if the loop never succeeds.
          timeout 30 bash -c \
            'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'

          # Create the test bucket. AWS CLI is pre-installed on ubuntu-latest.
          # Credentials must match MINIO_ROOT_USER / MINIO_ROOT_PASSWORD above.
          AWS_ACCESS_KEY_ID=minioadmin \
          AWS_SECRET_ACCESS_KEY=minioadmin \
          aws s3 mb s3://marketplace-test \
            --endpoint-url http://localhost:9000 \
            --region us-east-1

      - name: Install Playwright browsers
        run: pnpm --filter @marketplace/web exec playwright install --with-deps chromium

      # globalSetup (setup-e2e.js) runs prisma migrate deploy + seed-test.ts.
      # dotenv.config() inside globalSetup is a no-op in CI (vars already in env).
      - name: Backend e2e — Jest
        run: pnpm --filter @marketplace/api test:e2e

      # Playwright spawns the backend (port 3001) and frontend (port 3000) via
      # webServer because reuseExistingServer = !process.env.CI = false.
      # global-setup.ts migrates (idempotent after Jest), seeds Playwright users,
      # and saves storageState. The backend webServer receives { ...process.env,
      # ...testEnv, PORT: '3001' } — the fix in playwright.config.ts ensures all
      # job env vars reach the NestJS process when .env.test is absent in CI.
      - name: Frontend e2e — Playwright
        run: pnpm --filter @marketplace/web test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
